const GR=12000,GT=300,CR=3000,AW=2.8;
const N=60000,gPos=new Float32Array(N*3),gCol=new Float32Array(N*3);
const _c=new THREE.Color();
for(let i=0;i<N;i++){
  const r=Math.random();
  if(r<0.15){
    const d=Math.pow(Math.random(),0.6)*CR;
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    const x=Math.sin(ph)*Math.cos(th)*d,z=Math.sin(ph)*Math.sin(th)*d,y=Math.cos(ph)*d*(0.3+Math.random()*0.5);
    gPos[i*3]=x;gPos[i*3+1]=y;gPos[i*3+2]=z;
    const l=0.5+Math.random()*0.4;_c.setHSL(0.08+Math.random()*0.04,0.3+Math.random()*0.2,l);
  }else{
    const arm=Math.random()<0.5?0:1;
    const d=CR+Math.pow(Math.random(),0.7)*(GR-CR);
    const spread=(10+d/GR*40)*(1+Math.random()*0.5);
    const a=arm*Math.PI+(d/GR)*AW+(Math.random()-0.5)*0.25;
    const x=Math.cos(a)*d+(Math.random()-0.5)*spread,z=Math.sin(a)*d+(Math.random()-0.5)*spread;
    const th=Math.atan2(z,x);
    const armDist=Math.abs(Math.sin((th-arm*Math.PI-d/GR*AW)*2));
    const armProb=1-Math.min(1,armDist*0.8);
    const y=(Math.random()-0.5)*GT*(0.05+0.95*(1-d/GR));
    gPos[i*3]=x;gPos[i*3+1]=y;gPos[i*3+2]=z;
    if(armProb>0.4&&Math.random()<0.7){_c.setHSL(0.55+Math.random()*0.08,0.4+Math.random()*0.3,0.6+Math.random()*0.4);}
    else if(armProb>0.2){_c.setHSL(0.1+Math.random()*0.1,0.2+Math.random()*0.3,0.55+Math.random()*0.35);}
    else{_c.setHSL(0.08+Math.random()*0.08,0.15+Math.random()*0.2,0.3+Math.random()*0.3);}
  }
  gCol[i*3]=_c.r;gCol[i*3+1]=_c.g;gCol[i*3+2]=_c.b;
}

function showNotif(title,text,btns){const el=document.getElementById('notif');el.classList.add('open');el.innerHTML=`<h2>${title}</h2><p>${text}</p>`;if(btns)btns.forEach(b=>{const btn=document.createElement('button');btn.className='cb';btn.textContent=b.label;btn.onclick=()=>{el.classList.remove('open');if(b.fn)b.fn();};el.appendChild(btn);});else{const btn=document.createElement('button');btn.className='cb';btn.textContent='OK';btn.onclick=()=>el.classList.remove('open');el.appendChild(btn);}}
function fmtNum(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0);}

function renderResearch(){const el=document.getElementById('researchPanel');let h='<h3>Research</h3>';for(const[branch,techs]of Object.entries(TECH_TREE)){h+=`<div class="rBranch"><div class="bTitle">${branch}</div>`;techs.forEach(t=>{const unlocked=GAME.tech[t.id];const canUnlock=!unlocked&&techs.every(r=>!r.req.length||r.req.some(rid=>GAME.tech[rid]))&&Object.entries(t.cost).every(([k,v])=>GAME[k]>=v);const cls=unlocked?'unlocked':canUnlock?'available':'locked';const costStr=Object.entries(t.cost).map(([k,v])=>`${fmtNum(v)} ${k}`).join(', ');h+=`<div class="rTech ${cls}" data-tech="${t.id}"><div><div>${t.name}</div><div style="font-size:9px;opacity:0.5">${t.desc}</div></div><div class="cost">${unlocked?'DONE':costStr}</div></div>`;});h+='</div>';}el.innerHTML=h;el.querySelectorAll('.rTech.available').forEach(el=>{el.addEventListener('click',()=>researchTech(el.dataset.tech));});}
function researchTech(id){let tech=null;for(const techs of Object.values(TECH_TREE)){tech=techs.find(t=>t.id===id);if(tech)break;}if(!tech||GAME.tech[id])return;for(const[k,v]of Object.entries(tech.cost)){if(GAME[k]<v)return;}for(const[k,v]of Object.entries(tech.cost))GAME[k]-=v;GAME.tech[id]=true;for(const[k,v]of Object.entries(tech.effect)){if(k==='energyRate')GAME.energyRate+=v;else if(k==='matterRate')GAME.matterRate+=v;else if(k==='dataRate')GAME.dataRate+=v;else if(k==='popRate')GAME.popRate+=v;else if(k==='popCap')GAME.popCap+=v;else if(k==='rockets')GAME.rockets+=v;else if(k==='kard')GAME.kardashev=Math.max(GAME.kardashev,v);}if(tech.kard)GAME.kardashev=Math.max(GAME.kardashev,tech.kard);showNotif('Research Complete',`<b>${tech.name}</b><br>${tech.desc}`);renderResearch();renderBuild();updateGameBar();saveGame();}

function renderBuild(){const el=document.getElementById('buildPanel');let h='<h3>Build</h3>';BUILDINGS.forEach(b=>{const unlocked=GAME.tech[b.techReq];const canBuild=unlocked&&Object.entries(b.cost).every(([k,v])=>GAME[k]>=v);const cls=unlocked?(canBuild?'':'locked'):'locked';const costStr=Object.entries(b.cost).map(([k,v])=>`${fmtNum(v)} ${k}`).join(', ');h+=`<div class="bItem ${cls}" data-bid="${b.id}"><div class="biName">${b.emoji} ${b.name}</div><div class="biDesc">${b.desc}</div><div class="biCost">${unlocked?costStr:'Need: '+b.techReq}</div></div>`;});el.innerHTML=h;el.querySelectorAll('.bItem:not(.locked)').forEach(el=>{el.addEventListener('click',()=>buildItem(el.dataset.bid));});}
function buildItem(id){const b=BUILDINGS.find(x=>x.id===id);if(!b)return;for(const[k,v]of Object.entries(b.cost)){if(GAME[k]<v)return;}for(const[k,v]of Object.entries(b.cost))GAME[k]-=v;for(const[k,v]of Object.entries(b.effect)){if(k==='energyRate')GAME.energyRate+=v;else if(k==='matterRate')GAME.matterRate+=v;else if(k==='dataRate')GAME.dataRate+=v;else if(k==='popRate')GAME.popRate+=v;else if(k==='popCap')GAME.popCap+=v;else if(k==='launchCap')GAME.launchCap=true;}GAME.buildings.push(id);showNotif('Built',`${b.emoji} ${b.name} constructed!`);renderBuild();updateGameBar();saveGame();}

function renderLaunch(){const el=document.getElementById('launchPanel');if(!GAME.launchCap){el.innerHTML='<h3>Launch</h3><p style="opacity:0.5;font-size:11px">Build a Launch Pad first.</p>';return;}const dests=[{name:'Moon',idx:allObjs.findIndex(o=>o.name==='Moon'),req:'chem'},{name:'Mars',idx:allObjs.findIndex(o=>o.name==='Mars'),req:'chem'},{name:'Jupiter (Europa)',idx:allObjs.findIndex(o=>o.name==='Europa'),req:'nuclear'},{name:'Saturn (Titan)',idx:allObjs.findIndex(o=>o.name==='Titan'),req:'fusion_r'},{name:'Proxima Centauri',idx:allObjs.findIndex(o=>o.name==='Proxima Centauri'),req:'alcm'},{name:'Intergalactic',idx:-1,req:'exgal',exgal:true}];let h='<h3>Launch</h3>';if(GAME.launchTimer>0){h+=`<p style="color:#ca8">Launching... ${GAME.launchTimer.toFixed(1)}s</p>`;el.innerHTML=h;return;}dests.forEach(d=>{const unlocked=GAME.tech[d.req];h+=`<div class="dest ${unlocked?'':'locked'}" data-idx="${d.idx}" data-exgal="${d.exgal||''}"><span>${d.name}</span><span style="font-size:9px;opacity:0.5">${unlocked?'Ready':'Need: '+d.req}</span></div>`;});el.innerHTML=h;el.querySelectorAll('.dest:not(.locked)').forEach(el=>{el.addEventListener('click',()=>{const idx=parseInt(el.dataset.idx);const exgal=el.dataset.exgal==='true';launchRocket(idx,exgal);});});}

function travelTo(i){if(i>=allObjs.length)return;if(i<0){exgalacticTravel();return;}traveling=true;travelT=0;travelFrom.copy(cam.position);const tgt=allObjs[i].mesh.position.clone();const dir=cam.position.clone().sub(tgt).normalize().multiplyScalar(Math.max(allObjs[i].dist*0.08+2,3));if(dir.length()<1)dir.set(3,2,3);travelDest=tgt.clone().add(dir);travelDur=CFG.travelDur;document.getElementById('travelOverlay').classList.add('active');warpPts.visible=true;focusI=i;document.getElementById('focusName').textContent=allObjs[i].name;document.getElementById('focusType').textContent=allObjs[i].type;document.getElementById('tMode').textContent='Travel';}

function setTimeScale(i){tsI=Math.max(0,Math.min(tScales.length-1,i));timeScale=tScales[tsI];document.getElementById('tTime').textContent=timeScale===0?'0x':timeScale+'x';}

function maxSpeed(){
  if(!GAME.started)return 500;
  if(GAME.tech['warp'])return 200000;
  if(GAME.tech['alcm'])return 20000;
  if(GAME.tech['fusion_r'])return 2000;
  if(GAME.tech['nuclear'])return 400;
  if(GAME.tech['ion'])return 150;
  if(GAME.tech['chem'])return 60;
  return 20;
}

function updateCam(dt){
  if(traveling){
    travelT+=dt;const t=Math.min(travelT/travelDur,1);
    const ease=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    cam.position.lerpVectors(travelFrom,travelDest,ease).add(new THREE.Vector3(0,3,0));
    cam.lookAt(travelDest);
    const wp=warpG.attributes.position.array;for(let i=0;i<WN;i++)wp[i*3+2]=-5-((i*17)%40)-ease*80+Math.sin(i*0.3)*2;warpG.attributes.position.needsUpdate=true;
    document.getElementById('tAlt').textContent=(cam.position.length()).toFixed(1)+'AU';
    if(t>=1){traveling=false;warpPts.visible=false;document.getElementById('travelOverlay').classList.remove('active');document.getElementById('tMode').textContent='Free';flyYaw=Math.atan2(cam.position.x-allObjs[focusI].mesh.position.x,cam.position.z-allObjs[focusI].mesh.position.z);flyPitch=0;flyVel.set(0,0,0);}
    return;
  }
  const fwd=new THREE.Vector3(-Math.sin(flyYaw)*Math.cos(flyPitch),Math.sin(flyPitch),-Math.cos(flyYaw)*Math.cos(flyPitch));
  const right=new THREE.Vector3(Math.cos(flyYaw),0,-Math.sin(flyYaw));
  const speed=CFG.camSpeed*dt;
  if(keys['w'])flyVel.add(fwd.clone().multiplyScalar(speed));if(keys['s'])flyVel.add(fwd.clone().multiplyScalar(-speed));
  if(keys['a'])flyVel.add(right.clone().multiplyScalar(-speed));if(keys['d'])flyVel.add(right.clone().multiplyScalar(speed));
  if(keys['q'])flyVel.y+=speed;if(keys['e'])flyVel.y-=speed;
  const ms=maxSpeed();const spd=flyVel.length();if(spd>ms)flyVel.multiplyScalar(ms/spd);
  flyVel.multiplyScalar(0.88);cam.position.add(flyVel.clone().multiplyScalar(dt*60));
  cam.lookAt(cam.position.clone().add(new THREE.Vector3(-Math.sin(flyYaw)*Math.cos(flyPitch),Math.sin(flyPitch),-Math.cos(flyYaw)*Math.cos(flyPitch)).multiplyScalar(100)));
  const dist=cam.position.length();
  document.getElementById('tAlt').textContent=dist<2?(dist*149597870.7).toFixed(0)+' km':dist<500?dist.toFixed(1)+' AU':(dist/1000).toFixed(2)+' kly';
  document.getElementById('tFlySpeed').textContent=CFG.camSpeed+'/'+ms;
  galaxyGroup.visible=dist>3000;
}

let time=0;
function sim(dt){
  const sdt=dt*timeScale;time+=sdt;
  pMeshes.forEach((pm,idx)=>{
    const p=pm.data;oAngles[idx]+=p.spd*sdt*0.3;const a=oAngles[idx];
    const x=p.dist*Math.cos(a),z=p.dist*Math.sin(a),y=Math.sin(p.inc)*p.dist*0.03;
    pm.mesh.position.set(x,y,z);pm.mesh.rotation.y+=sdt*0.2;
    if(pm.ring)pm.ring.position.copy(pm.mesh.position);
    if(pm.atmo)pm.atmo.position.copy(pm.mesh.position);
    pm.moons.forEach(m=>{m.angle+=m.data.spd*sdt*0.3;const md=m.data.d;m.mesh.position.set(x+Math.cos(m.angle)*md,y+Math.sin(m.angle*0.7)*0.1,z+Math.sin(m.angle)*md);});
  });
  for(let i=0;i<wN;i++){wL[i]+=sdt;if(wL[i]>wML[i]){spW(i);continue;}const ix=i*3,px=wP[ix],py=wP[ix+1],pz=wP[ix+2];const d=Math.sqrt(px*px+py*py+pz*pz);if(d>0.1){const g=5/(d*d);wV[ix]-=(px/d)*g*sdt;wV[ix+1]-=(py/d)*g*sdt;wV[ix+2]-=(pz/d)*g*sdt;}wV[ix]*=0.999;wV[ix+1]*=0.999;wV[ix+2]*=0.999;wP[ix]+=wV[ix]*sdt;wP[ix+1]+=wV[ix+1]*sdt;wP[ix+2]+=wV[ix+2]*sdt;const lr=wL[i]/wML[i];wC[ix]=1*(1-lr*0.5);wC[ix+1]=(0.6+0.3*(1-lr))*(1-lr*0.3);wC[ix+2]=(0.1+0.2*(1-lr))*(1-lr*0.5);}
  wG.attributes.position.needsUpdate=true;wG.attributes.color.needsUpdate=true;
  sunM.scale.setScalar(1+0.02*Math.sin(time*0.8));
  if(GAME.launchTimer>0){GAME.launchTimer-=dt;if(GAME.launchTimer<=0){if(GAME.launchExgal){GAME.launchExgal=false;exgalacticTravel();}else if(GAME.launchTarget!=null&&GAME.launchTarget>=0){GAME.rockets=Math.max(0,GAME.rockets-1);travelTo(GAME.launchTarget);showNotif('Arrival',`Your vessel has reached ${allObjs[GAME.launchTarget].name}!`);}GAME.launchTarget=null;}}
}

function simGame(dt){if(!GAME.started)return;const sdt=dt*timeScale;GAME.gameTime+=sdt;GAME.energy+=GAME.energyRate*sdt;GAME.matter+=GAME.matterRate*sdt;GAME.data+=GAME.dataRate*sdt;if(GAME.popRate)GAME.pop=Math.min(GAME.pop+GAME.popRate*sdt,GAME.popCap);if(GAME.gameTime%1<dt*timeScale)updateGameBar();}

  if(GAME.started&&e.key==='b'){const p=document.getElementById('buildPanel');if(activePanel==='build'){p.classList.remove('open');activePanel=null;}else{['researchPanel','launchPanel','objectMenu','settingsPanel'].forEach(id=>document.getElementById(id).classList.remove('open'));p.classList.add('open');activePanel='build';renderBuild();}}
  if(GAME.started&&e.key==='t'){const p=document.getElementById('researchPanel');if(activePanel==='research'){p.classList.remove('open');activePanel=null;}else{['buildPanel','launchPanel','objectMenu','settingsPanel'].forEach(id=>document.getElementById(id).classList.remove('open'));p.classList.add('open');activePanel='research';renderResearch();}}
  if(GAME.started&&e.key==='l'){const p=document.getElementById('launchPanel');if(activePanel==='launch'){p.classList.remove('open');activePanel=null;}else{['buildPanel','researchPanel','objectMenu','settingsPanel'].forEach(id=>document.getElementById(id).classList.remove('open'));p.classList.add('open');activePanel='launch';renderLaunch();}}
  if(e.key==='g'){GAME.galaxyView=!GAME.galaxyView;galaxyGroup.visible=GAME.galaxyView;if(GAME.galaxyView){flyVel.set(0,0,0);cam.position.set(0,15000,0);flyPitch=-Math.PI/2;flyYaw=0;}}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('mousedown',e=>{drag=true;lastM={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(!drag||traveling)return;
  const dx=e.clientX-lastM.x,dy=e.clientY-lastM.y;
  flyYaw-=dx*0.004;flyPitch=Math.max(-Math.PI/2+0.01,Math.min(Math.PI/2-0.01,flyPitch-dy*0.004));
  lastM={x:e.clientX,y:e.clientY};
});
window.addEventListener('wheel',e=>{CFG.camSpeed=Math.max(5,Math.min(maxSpeed(),CFG.camSpeed-e.deltaY*0.05));});
window.addEventListener('click',()=>initA(),{once:true});

document.getElementById('btnTimeDown').addEventListener('click',()=>setTimeScale(tsI-1));
document.getElementById('btnTimeUp').addEventListener('click',()=>setTimeScale(tsI+1));
document.getElementById('btnSettings').addEventListener('click',()=>{const p=document.getElementById('settingsPanel');if(activePanel==='settings'){p.classList.remove('open');activePanel=null;}else{['researchPanel','buildPanel','launchPanel','objectMenu'].forEach(id=>document.getElementById(id).classList.remove('open'));p.classList.toggle('open');activePanel=p.classList.contains('open')?'settings':null;}});
document.getElementById('btnResearch').addEventListener('click',()=>{const p=document.getElementById('researchPanel');if(activePanel==='research'){p.classList.remove('open');activePanel=null;}else{['buildPanel','launchPanel','objectMenu','settingsPanel'].forEach(id=>document.getElementById(id).classList.remove('open'));p.classList.add('open');activePanel='research';renderResearch();}});
document.getElementById('btnBuild').addEventListener('click',()=>{const p=document.getElementById('buildPanel');if(activePanel==='build'){p.classList.remove('open');activePanel=null;}else{['researchPanel','launchPanel','objectMenu','settingsPanel'].forEach(id=>document.getElementById(id).classList.remove('open'));p.classList.add('open');activePanel='build';renderBuild();}});
document.getElementById('btnLaunch').addEventListener('click',()=>{const p=document.getElementById('launchPanel');if(activePanel==='launch'){p.classList.remove('open');activePanel=null;}else{['researchPanel','buildPanel','objectMenu','settingsPanel'].forEach(id=>document.getElementById(id).classList.remove('open'));p.classList.add('open');activePanel='launch';renderLaunch();}});
document.getElementById('btnGalaxy').addEventListener('click',()=>{GAME.galaxyView=!GAME.galaxyView;galaxyGroup.visible=GAME.galaxyView;if(GAME.galaxyView){flyVel.set(0,0,0);cam.position.set(0,15000,0);flyPitch=-Math.PI/2;flyYaw=0;}});
document.getElementById('setMusic').addEventListener('input',e=>{CFG.musicVol=e.target.value/100;if(mGain)mGain.gain.value=CFG.musicVol;});
document.getElementById('setPlanetAudio').addEventListener('input',e=>{CFG.planetVol=e.target.value/100;if(pGain)pGain.gain.value=CFG.planetVol;});

document.getElementById('setCamSpeed').addEventListener('input',e=>{CFG.camSpeed=parseInt(e.target.value);});


document.getElementById('introBegin').addEventListener('click',()=>{
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('gameBar').style.display='flex';
  GAME.started=true;
  if(!loadGame()){
    showNotif('THE SYSTEM','Your thrusters are limited. Speed is capped by your technology level.<br><br><b>Research</b> propulsion tech to fly faster.<br><b>Build</b> infrastructure to gather resources.<br><b>Launch</b> rockets to distant worlds.<br><br><b>WASD</b> fly · <b>Drag</b> look · <b>Scroll</b> zoom · <b>Q/E</b> up/down · <b>Tab</b> cycle<br><b>B</b> Build · <b>T</b> Research · <b>L</b> Launch · <b>G</b> Galaxy<br><br><span style="font-size:9px;opacity:0.5">Current max speed: <b>20 AU/s</b>. Research Chemical Rockets to reach 60.</span>',[{label:'Begin',fn:()=>{}}]);
  }
  CFG.camSpeed=Math.min(CFG.camSpeed,maxSpeed());
  initA();
});
cam.position.set(50,25,70);flyYaw=-Math.PI/6;flyPitch=-0.15;focusI=0;


</script>
</body>
</html>
